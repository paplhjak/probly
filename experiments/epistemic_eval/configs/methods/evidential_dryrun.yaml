# Dry-run override of `evidential.yaml`.
#
# Single-epoch variant for end-to-end pipeline verification on the
# cluster (fit -> extract -> decompose -> metrics). NOT for the
# paper-grid run; production grids use `evidential.yaml`. See
# `experiments/epistemic_eval/cluster/README.md` -> "Dry runs".
#
# All other knobs identical to `evidential.yaml` so any pipeline
# regression here surfaces in the production config too.

name: evidential
method_module: experiments.epistemic_eval.methods.evidential_classification

output_schema: evidential_alpha

# Differs from evidential.yaml only here: 30 -> 1.
epochs: 1
lr: 1.0e-3
weight_decay: 5.0e-4

kl_lambda: 0.0
