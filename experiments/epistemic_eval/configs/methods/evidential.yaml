# Evidential classification method config.
#
# Wraps probly's evidential_classification (single-pass Dirichlet
# output) via experiments.epistemic_eval.methods.evidential_classification.
# See decisions.md "Methods to evaluate" for the rationale.

name: evidential
method_module: experiments.epistemic_eval.methods.evidential_classification

# Cache schema declaration. compute_decomposition.py reads this
# field to dispatch to the right per-schema decomposition function.
output_schema: evidential_alpha

# Training hyperparameters. The recipe (SGD + cosine, matching
# basecls in cifar10h.yaml) is locked across all four UQ methods so
# the cross-method comparison is recipe-uniform. Sensoy 2018 trained
# the original evidential network with Adam, but the soft-label
# evidential CE in the wrapper is well-posed under SGD; we picked
# uniformity over per-method literature alignment. The wrapper reads
# ``epochs``, ``lr``, ``momentum``, ``nesterov``, ``weight_decay``;
# ``schedule`` is documentation only.
epochs: 200
lr: 0.1
momentum: 0.9
nesterov: false
weight_decay: 5.0e-4
schedule: cosine

# Sensoy 2018 KL regulariser weight on wrong-class concentrations.
# 0.0 = no regulariser (the smoke-test variant); the standard recipe
# uses an annealed weight in [0, 1]. Currently unused by the wrapper
# (kept here as a hook for the production recipe).
kl_lambda: 0.0
