# MiceBone dataset config (DCIC family).
#
# MiceBone consists of microscope images of mouse tissue
# (second-harmonic-generation imagery of collagen fibres),
# multi-class classification of fibre orientation, ~7 240 images at
# 224x224 native resolution with multi-rater soft labels (DCIC
# release per Schmarje et al. 2022). The release table reports 4
# classes; the prose describes 3 ('g', 'ug', 'nr'). We over-allocate
# the classifier head to 4 to match the table; if the data has only
# 3 the unused column is harmless. See decisions.md "DCIC datasets"
# for the locked recipe.

name: mice_bone
family: dcic
loader:
  module: probly.datasets.torch
  class: MiceBone
  dcic_name: MiceBone
loader_kwargs:
  root: data
supported_losses: [cross_entropy, zero_one]
extraction_mode: full_network
classifier:
  architecture: torchvision.models.resnet18
  pretrained: true
  pretrained_classifier_path: null
  num_classes: 4
training:
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 32
  epochs: 20
  patience: 4
  val_fraction: 0.1
  num_workers: 4
  augmentation:
    horizontal_flip: true
  method_overrides:
    epochs: 20
    lr: 1.0e-3
    momentum: 0.9
    nesterov: false
    weight_decay: 1.0e-4
metadata:
  num_classes: 4
  notes: >-
    DCIC MiceBone release (Zenodo records/7180818). Native 224x224;
    no upscale. Test fold rotates per seed.
