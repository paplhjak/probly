# MiceBone dataset config (DCIC family).
#
# MiceBone consists of microscope images of mouse tissue
# (second-harmonic-generation imagery of collagen fibres),
# 3-class classification of fibre orientation ('g', 'ug', 'nr'),
# ~7 240 images at 224x224 native resolution with multi-rater soft
# labels (DCIC release per Schmarje et al. 2022). The DCIC README
# table mistakenly reports 4 classes; the prose and the actual
# annotations have 3 -- verified at runtime by sizing the classifier
# head to 3 and confirming targets are (B, 3). See decisions.md
# "DCIC datasets" for the locked recipe.

name: mice_bone
family: dcic
loader:
  module: probly.datasets.torch
  class: MiceBone
  dcic_name: MiceBone
loader_kwargs:
  root: data
supported_losses: [cross_entropy, zero_one]
extraction_mode: full_network
classifier:
  architecture: torchvision.models.resnet18
  pretrained: true
  pretrained_classifier_path: null
  num_classes: 3
training:
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 32
  epochs: 200
  patience: 100
  val_fraction: 0.1
  num_workers: 0
  schedule: cosine
  augmentation:
    horizontal_flip: true
  method_overrides:
    epochs: 200
    lr: 3.0e-3
    momentum: 0.9
    nesterov: false
    weight_decay: 1.0e-4
metadata:
  num_classes: 3
  notes: >-
    DCIC MiceBone release (Zenodo records/7180818). Native 224x224;
    no upscale. Test fold rotates per seed.
