# Treeversity#1 dataset config (DCIC family).
#
# Treeversity#1 is plant-species classification with one label per
# image (single-label variant), 6-class, ~9 489 images at 224x224
# native resolution with multi-rater soft labels (DCIC release per
# Schmarje et al. 2022). Note the on-disk directory name contains a
# literal ``#`` character (``Treeversity#1``); the loader handles
# this transparently. See decisions.md "DCIC datasets" for the
# locked recipe.

name: treeversity_1
family: dcic
loader:
  module: probly.datasets.torch
  class: Treeversity1
  dcic_name: "Treeversity#1"
loader_kwargs:
  root: data
supported_losses: [cross_entropy, zero_one]
extraction_mode: full_network
classifier:
  architecture: torchvision.models.resnet18
  pretrained: true
  pretrained_classifier_path: null
  num_classes: 6
training:
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 32
  epochs: 20
  patience: 4
  val_fraction: 0.1
  num_workers: 4
  augmentation:
    horizontal_flip: true
  method_overrides:
    epochs: 20
    lr: 1.0e-3
    momentum: 0.9
    nesterov: false
    weight_decay: 1.0e-4
metadata:
  num_classes: 6
  notes: >-
    DCIC Treeversity#1 release (Zenodo records/7180818). Native
    224x224. Single-label variant (avg. non-zero target classes
    1.68). Test fold rotates per seed.
