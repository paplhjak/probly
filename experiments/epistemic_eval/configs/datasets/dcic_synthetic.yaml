# Synthetic dataset config (DCIC family).
#
# Synthetic is a controlled benchmark of single-coloured-circle
# images on black backgrounds, 6-class classification, 15 000 images
# at 224x224 native resolution with multi-rater soft labels (DCIC
# release per Schmarje et al. 2022). Useful as a clean upper-bound
# baseline for AuReC since the task is forgiving and well-specified.
# See decisions.md "DCIC datasets" for the locked recipe.

name: dcic_synthetic
family: dcic
loader:
  module: probly.datasets.torch
  class: Synthetic
  dcic_name: Synthetic
loader_kwargs:
  root: data
supported_losses: [cross_entropy, zero_one]
extraction_mode: full_network
classifier:
  architecture: torchvision.models.resnet18
  pretrained: true
  pretrained_classifier_path: null
  num_classes: 6
training:
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 32
  epochs: 20
  patience: 4
  val_fraction: 0.1
  num_workers: 4
  augmentation:
    horizontal_flip: true
  method_overrides:
    epochs: 20
    lr: 1.0e-3
    momentum: 0.9
    nesterov: false
    weight_decay: 1.0e-4
metadata:
  num_classes: 6
  notes: >-
    DCIC Synthetic release (Zenodo records/7180818). Native 224x224.
    The dataset name is prefixed (``dcic_synthetic``) to avoid
    colliding with ``synthetic_*`` smoke fixtures elsewhere in the
    pipeline. Test fold rotates per seed.
