# Pig dataset config (DCIC family).
#
# Pig consists of livestock tail imagery from European farms,
# 4-class severity classification, ~10 237 images at 96x96 native
# resolution with multi-rater soft labels (DCIC release per Schmarje
# et al. 2022). See decisions.md "DCIC datasets" for the locked
# recipe shared across all DCIC datasets in this paper.

name: pig
family: dcic
loader:
  module: probly.datasets.torch
  class: Pig
  dcic_name: Pig
loader_kwargs:
  root: data
supported_losses: [cross_entropy, zero_one]
extraction_mode: full_network
classifier:
  architecture: torchvision.models.resnet18
  pretrained: true
  pretrained_classifier_path: null
  num_classes: 4
training:
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 32
  epochs: 200
  patience: 100
  val_fraction: 0.1
  num_workers: 0
  schedule: cosine
  augmentation:
    horizontal_flip: true
  method_overrides:
    epochs: 200
    lr: 3.0e-3
    momentum: 0.9
    nesterov: false
    weight_decay: 1.0e-4
metadata:
  num_classes: 4
  notes: >-
    DCIC Pig release (Zenodo records/7180818). Native 96x96; resized
    to 224x224 by the DCIC adapter. Test fold rotates per seed.
