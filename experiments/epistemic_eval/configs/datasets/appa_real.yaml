# APPA-REAL dataset config.
#
# Apparent-age dataset (Agustsson et al. 2017) with per-rater integer
# votes treated as p*(y|x) over the integer-age support. Per
# decisions.md "APPA-REAL deployment losses", we report BOTH squared
# and absolute error as primary results; AuReC and the Pareto-gap
# consume scalar (A_hat, E_hat) per loss without knowing which loss
# produced them.
#
# The default support is the per-split union of observed integer ages.
# For the paper's main results we override age_support at runtime with
#   support = AppaReal.compute_global_support(root)
# so that A* / E* oracle computations are comparable across splits.

name: appa_real
loader:
  module: probly.datasets.appa_real
  class: AppaReal
loader_kwargs:
  root: data/appa_real
  split: test
  # age_support is filled at runtime by:
  #   support = AppaReal.compute_global_support(root)
  # See decisions.md "APPA-REAL deployment losses" for why the global
  # support is used for the paper's main results.
supported_losses: [squared, absolute]
extraction_mode: linear_probe
backbone:
  architecture: torchvision.models.resnet101
  weights_path: experiments/epistemic_eval/assets/appa_real_backbone/weights.pth
  feature_dim: 2048
  preprocessing:
    image_size: [256, 256]
    normalization:
      mean: [0.485, 0.456, 0.406]
      std:  [0.229, 0.224, 0.225]
head:
  architecture: probly.method.head.MlpHead
  hidden: 256
training:
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 128
  epochs: 50
  schedule: cosine
metadata:
  notes: "Apparent age, integer-vote histogram over age_support."
