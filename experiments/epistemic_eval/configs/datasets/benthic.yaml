# Benthic dataset config (DCIC family).
#
# Benthic consists of seafloor imagery (underwater flora and fauna),
# 8-class classification, ~4 867 images at 112x112 native resolution
# with multi-rater soft labels (DCIC release per Schmarje et al.
# 2022). See decisions.md "DCIC datasets" for the locked recipe
# shared across all DCIC datasets in this paper.

name: benthic
family: dcic
loader:
  module: probly.datasets.torch
  class: Benthic
  dcic_name: Benthic
loader_kwargs:
  root: data
supported_losses: [cross_entropy, zero_one]
extraction_mode: full_network
classifier:
  architecture: torchvision.models.resnet18
  pretrained: true
  pretrained_classifier_path: null
  num_classes: 8
training:
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 32
  epochs: 100
  patience: 20
  val_fraction: 0.1
  num_workers: 0
  schedule: cosine
  augmentation:
    horizontal_flip: true
  method_overrides:
    epochs: 100
    lr: 3.0e-3
    momentum: 0.9
    nesterov: false
    weight_decay: 1.0e-4
metadata:
  num_classes: 8
  notes: >-
    DCIC Benthic release (Zenodo records/7180818). Native 112x112;
    resized to 224x224 by the DCIC adapter to match the torchvision
    ResNet-18 input. Test fold rotates per seed.
